# Vox Kbd build configuration (see docs/功能文档.md §1.4 D1, §5).
#
# Target = Java 版 26.2「混沌立方」(released 2026-06-16) — decision D1. This is a REAL, published
# Fabric version. Confirmed coordinates on the Fabric maven:
#   minecraft_version = 26.2
#   fabric_loader_version = 0.19.3
#   fabric_api_version = 0.158.0+26.2
#   loom_version = 1.10.5
# NOTE: net.fabricmc:yarn has NO 26.2 mappings; the mod builds against intermediary:26.2 instead
# (see voxkbd-mod/build.gradle.kts). The mod source's MC references are remapped to intermediary names.
minecraft_version=26.2
yarn_mappings=26.2+build.1
fabric_loader_version=0.19.3

# Fabric API aligned to the chosen MC release.
fabric_api_version=0.158.0+26.2

# Loom plugin version — 1.18.x is the generation for the MC 26.2 era (1.10.x is too old and
# hardcodes an "intermediary" javadoc-namespace check that fabric-api 0.158.0+26.2 violates).
loom_version=1.18.0-alpha.16

mod_version=1.0.1
maven_group=com.voxkbd
archives_base_name=voxkbd

# Mod metadata
mod_name=Vox Kbd
mod_author=VoxKbd
mod_description=Virtual keyboards: an infinitely extensible key layer for modpacks without touching vanilla bindings.
