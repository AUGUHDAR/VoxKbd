plugins {
    id 'java'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[7.0.3,8)'
}

version = "1.0.1-1.21.9_1.21.10-forge"
group = "com.voxkbd"
base { archivesName = "voxkbd" }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    mappings channel: 'official', version: '1.21.10'
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:1.21.10-60.1.13")
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        minecraft_version      : '1.21.10',
        minecraft_version_range: '[1.21.9,1.21.11)',
        forge_version          : '60.1.13',
        forge_version_range    : '[60,61)',
        loader_version_range   : '[2,)',
        mod_id                 : 'voxkbd',
        mod_version            : '1.0.1',
        mod_license            : 'MIT',
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'    : 'voxkbd',
                'Specification-Vendor'   : 'VoxKbd',
                'Specification-Version'  : '1',
                'Implementation-Title'   : 'Vox Kbd',
                'Implementation-Version' : project.version,
                'MixinConfigs'           : 'voxkbd.mixins.json'
        ])
    }
    from("../../LICENSE") {}
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
