plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.14.9'
}

version = "1.0.1-1.21.11-fabric"
group = "com.voxkbd"
base { archivesName = "voxkbd" }

repositories {
    mavenCentral()
}

loom {
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = "voxkbd.refmap.json"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.11"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.19.2"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.141.4+1.21.11"

    include("net.java.dev.jna:jna:5.14.0")
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        mod_id            : "voxkbd",
        mod_version       : "1.0.1",
        minecraft_version : "1.21.11",
        minecraft_version_range: "1.21.11",
        version           : project.version,
    ]
    inputs.properties replaceProperties
    filesMatching(['fabric.mod.json']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("../../LICENSE") {}
}
